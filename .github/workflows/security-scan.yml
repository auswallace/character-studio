name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    outputs:
      found_issues: ${{ steps.scan.outputs.found_issues }}
      summary: ${{ steps.scan.outputs.summary }}
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        id: scan
        run: |
          pip install semgrep --quiet

          # Run scan, capture output
          set +e
          semgrep scan \
            --config p/nextjs \
            --config p/javascript \
            --config p/typescript \
            --config p/secrets \
            --config p/owasp-top-ten \
            --json \
            --output semgrep-results.json \
            dashboard/
          EXIT_CODE=$?
          set -e

          # Parse results
          FINDING_COUNT=$(python3 -c "
          import json
          with open('semgrep-results.json') as f:
              data = json.load(f)
          results = data.get('results', [])
          print(len(results))
          " 2>/dev/null || echo "0")

          if [ "$FINDING_COUNT" -gt 0 ]; then
            echo "found_issues=true" >> "$GITHUB_OUTPUT"

            # Build summary
            SUMMARY=$(python3 -c "
          import json
          with open('semgrep-results.json') as f:
              data = json.load(f)
          results = data.get('results', [])
          by_severity = {}
          for r in results:
              sev = r.get('extra', {}).get('severity', 'UNKNOWN')
              by_severity[sev] = by_severity.get(sev, 0) + 1
          parts = [f'{v} {k.lower()}' for k, v in sorted(by_severity.items())]
          print(f'Semgrep: {len(results)} findings ({', '.join(parts)})')
          ")
            echo "summary=$SUMMARY" >> "$GITHUB_OUTPUT"
          else
            echo "found_issues=false" >> "$GITHUB_OUTPUT"
            echo "summary=Semgrep: clean" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: semgrep-results.json
          retention-days: 30

  npm-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    outputs:
      found_issues: ${{ steps.audit.outputs.found_issues }}
      summary: ${{ steps.audit.outputs.summary }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: dashboard
        run: npm ci

      - name: Run npm audit
        id: audit
        working-directory: dashboard
        run: |
          set +e
          npm audit --json > audit-results.json 2>&1
          EXIT_CODE=$?
          set -e

          if [ "$EXIT_CODE" -gt 0 ]; then
            # Count vulnerabilities by severity
            SUMMARY=$(node -e "
              const data = require('./audit-results.json');
              const meta = data.metadata?.vulnerabilities || {};
              const total = (meta.moderate || 0) + (meta.high || 0) + (meta.critical || 0);
              const parts = [];
              if (meta.critical) parts.push(meta.critical + ' critical');
              if (meta.high) parts.push(meta.high + ' high');
              if (meta.moderate) parts.push(meta.moderate + ' moderate');
              console.log('npm audit: ' + total + ' vulnerabilities (' + parts.join(', ') + ')');
            " 2>/dev/null || echo "npm audit: issues found")

            echo "found_issues=true" >> "$GITHUB_OUTPUT"
            echo "summary=$SUMMARY" >> "$GITHUB_OUTPUT"
          else
            echo "found_issues=false" >> "$GITHUB_OUTPUT"
            echo "summary=npm audit: clean" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-results
          path: dashboard/audit-results.json
          retention-days: 30

  notify:
    name: Notify & Comment
    runs-on: ubuntu-latest
    needs: [semgrep, npm-audit]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Build report
        id: report
        run: |
          SEMGREP_ISSUES="${{ needs.semgrep.outputs.found_issues }}"
          AUDIT_ISSUES="${{ needs.npm-audit.outputs.found_issues }}"
          SEMGREP_SUMMARY="${{ needs.semgrep.outputs.summary }}"
          AUDIT_SUMMARY="${{ needs.npm-audit.outputs.summary }}"

          HAS_ISSUES="false"
          if [ "$SEMGREP_ISSUES" = "true" ] || [ "$AUDIT_ISSUES" = "true" ]; then
            HAS_ISSUES="true"
          fi

          echo "has_issues=$HAS_ISSUES" >> "$GITHUB_OUTPUT"

          # Build message body
          {
            echo 'body<<REPORT_EOF'
            echo "## Security Scan Results"
            echo ""
            if [ "$SEMGREP_ISSUES" = "true" ]; then
              echo "- :warning: **$SEMGREP_SUMMARY**"
            else
              echo "- :white_check_mark: $SEMGREP_SUMMARY"
            fi
            if [ "$AUDIT_ISSUES" = "true" ]; then
              echo "- :warning: **$AUDIT_SUMMARY**"
            else
              echo "- :white_check_mark: $AUDIT_SUMMARY"
            fi
            echo ""
            echo "Run: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo 'REPORT_EOF'
          } >> "$GITHUB_OUTPUT"

          # Telegram-friendly text (no markdown emoji shortcodes)
          {
            echo 'telegram_text<<TG_EOF'
            if [ "$HAS_ISSUES" = "true" ]; then
              echo "🚨 Security issues found in this repo"
            else
              echo "✅ Security scan passed for this repo"
            fi
            echo ""
            echo "$SEMGREP_SUMMARY"
            echo "$AUDIT_SUMMARY"
            echo ""
            echo "Branch: ${{ github.ref_name }}"
            echo "Commit: ${{ github.sha }}"
            echo "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo 'TG_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Send Telegram notification
        if: steps.report.outputs.has_issues == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::warning::Telegram secrets not configured — skipping notification"
            exit 0
          fi

          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="${{ steps.report.outputs.telegram_text }}" \
            -d parse_mode="" \
            > /dev/null

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const body = `${{ steps.report.outputs.body }}`;
            const marker = '<!-- security-scan-comment -->';
            const fullBody = marker + '\n' + body;

            // Find existing comment to update
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: fullBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: fullBody,
              });
            }
